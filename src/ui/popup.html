<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Shopping-Tab</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Google Shopping-Tab</h1>

    <script src="popup.js"></script>
  </body>
</html>
